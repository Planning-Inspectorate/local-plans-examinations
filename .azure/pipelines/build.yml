# just wait for PR to run on main as a trigger
pr: none
trigger: none

resources:
  repositories:
    - repository: templates
      type: github
      endpoint: Planning-Inspectorate
      name: Planning-Inspectorate/common-pipeline-templates
      ref: refs/tags/release/3.25.2
  pipelines:
    - pipeline: pr
      source: PR
      trigger:
        branches:
          include:
            - main

extends:
  template: stages/wrapper_ci.yml@templates
  parameters:
    gitFetchDepth: 0
    globalVariables:
      - template: .azure/pipelines/variables.yml@self
    validationJobs:
      - name: Docker Build Portal
        steps:
          - template: ../steps/azure_web_app_docker_build_push.yml@templates
            parameters:
              azurecrName: $(azurecrName)
              dockerfilePath: $(Build.SourcesDirectory)/apps/portal/Dockerfile
              repository: local-plans/portal
              buildArgs:
                - GIT_SHA=$(Build.SourceVersion)
      - name: Docker Build Manage
        steps:
          - template: ../steps/azure_web_app_docker_build_push.yml@templates
            parameters:
              azurecrName: $(azurecrName)
              dockerfilePath: $(Build.SourcesDirectory)/apps/manage/Dockerfile
              repository: local-plans/manage
              buildArgs:
                - GIT_SHA=$(Build.SourceVersion)
      - name: Function Build
        steps:
          - template: ../steps/node_script.yml
            parameters:
              nodeVersion: 24
              script: npm ci --omit=dev --workspace=local-plans-function --workspace=@pins/local-plans-database --workspace=@pins/local-plans-lib
              workingDirectory: $(Build.Repository.LocalPath)
          - template: ../steps/node_script.yml
            parameters:
              nodeVersion: 24
              script: npm run db-generate
              workingDirectory: $(Build.Repository.LocalPath)
          - script: |
              source ~/.bashrc
              # Copy root node_modules to the function without overwriting function-specific dependencies.
              rsync -a -r --ignore-existing $(Build.Repository.LocalPath)/node_modules/ $(Build.Repository.LocalPath)/apps/function/node_modules/
              # Copy workspace packages into the function package so Node can resolve them at runtime.
              mkdir -p $(Build.Repository.LocalPath)/apps/function/src/packages/local-plans-database
              mkdir -p $(Build.Repository.LocalPath)/apps/function/src/packages/local-plans-lib
              cp -r $(Build.Repository.LocalPath)/packages/database/* $(Build.Repository.LocalPath)/apps/function/src/packages/local-plans-database/
              cp -r $(Build.Repository.LocalPath)/packages/lib/* $(Build.Repository.LocalPath)/apps/function/src/packages/local-plans-lib/
              # Treat copied workspaces as function source to avoid subpath import issues.
              rm -f $(Build.Repository.LocalPath)/apps/function/src/packages/local-plans-database/package.json
              rm -f $(Build.Repository.LocalPath)/apps/function/src/packages/local-plans-lib/package.json
          - template: ../steps/node_script.yml
            parameters:
              nodeVersion: 24
              # Run after copying packages so replacements also apply to their source files.
              script: npm run prepare-package
              workingDirectory: $(Build.Repository.LocalPath)/apps/function
          - task: ArchiveFiles@2
            displayName: Archive files
            inputs:
              rootFolderOrFile: $(Build.Repository.LocalPath)/apps/function
              includeRootFolder: false
              archiveFile: $(System.DefaultWorkingDirectory)/functions.zip
          - publish: $(System.DefaultWorkingDirectory)/functions.zip
            artifact: function-doc-processing
            displayName: Publish Functions Artifact
