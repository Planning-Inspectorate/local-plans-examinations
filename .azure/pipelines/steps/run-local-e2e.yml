parameters:
  - name: target
    type: string
    values:
      - manage
      - portal
      - manage-portal
      - cross-service
  - name: shardIndex
    type: string
    default: '1'
  - name: shardCount
    type: string
    default: '1'

steps:
  - bash: |
      set -euo pipefail

      target="${{ parameters.target }}"
      run_manage_checks=false
      run_portal_checks=false
      run_cross_service_checks=false

      if [ "${BUILD_REASON:-}" = "Schedule" ] || [ "${BUILD_REASON:-}" = "Manual" ]; then
        case "$target" in
          manage)
            run_manage_checks=true
            ;;
          portal)
            run_portal_checks=true
            ;;
          manage-portal)
            run_manage_checks=true
            run_portal_checks=true
            ;;
          cross-service)
            run_cross_service_checks=true
            ;;
        esac
      else
        if [ -n "${SYSTEM_PULLREQUEST_TARGETBRANCH:-}" ]; then
          target_branch="${SYSTEM_PULLREQUEST_TARGETBRANCH#refs/heads/}"
          git fetch origin "refs/heads/$target_branch:refs/remotes/origin/$target_branch"
          base_commit="$(git merge-base HEAD "origin/$target_branch")"
        else
          base_commit="$(git rev-parse HEAD~1)"
        fi

        while IFS= read -r file; do
          [ -z "$file" ] && continue

          case "$file" in
            apps/manage/*)
              run_manage_checks=true
              run_cross_service_checks=true
              ;;
            apps/portal/*)
              run_portal_checks=true
              run_cross_service_checks=true
              ;;
            cypress/e2e/manage/*)
              run_manage_checks=true
              ;;
            cypress/e2e/portal/*)
              run_portal_checks=true
              ;;
            cypress/e2e/cross-service/*)
              run_cross_service_checks=true
              ;;
            cypress/*|.azure/pipelines/*|cypress.config.ts|docker-compose.yml|package.json|package-lock.json|packages/*)
              run_manage_checks=true
              run_portal_checks=true
              run_cross_service_checks=true
              ;;
          esac
        done <<< "$(git diff --name-only "$base_commit" HEAD)"

        case "$target" in
          manage)
            run_portal_checks=false
            run_cross_service_checks=false
            ;;
          portal)
            run_manage_checks=false
            run_cross_service_checks=false
            ;;
          manage-portal)
            run_cross_service_checks=false
            ;;
          cross-service)
            run_manage_checks=false
            run_portal_checks=false
            ;;
        esac
      fi

      echo "Detected E2E areas: manage=$run_manage_checks, portal=$run_portal_checks, cross-service=$run_cross_service_checks"
      echo "##vso[task.setvariable variable=runManageChecks]$run_manage_checks"
      echo "##vso[task.setvariable variable=runPortalChecks]$run_portal_checks"
      echo "##vso[task.setvariable variable=runCrossServiceChecks]$run_cross_service_checks"
    displayName: Detect changed E2E areas
  - task: UseNode@1
    condition: or(eq(variables.runManageChecks, 'true'), eq(variables.runPortalChecks, 'true'), eq(variables.runCrossServiceChecks, 'true'))
    displayName: Install Node.js
    inputs:
      version: '24.x'
  - task: Cache@2
    condition: or(eq(variables.runManageChecks, 'true'), eq(variables.runPortalChecks, 'true'), eq(variables.runCrossServiceChecks, 'true'))
    inputs:
      key: 'npm | "$(Agent.OS)" | package-lock.json'
      restoreKeys: |
        npm | "$(Agent.OS)" | package-lock.json
      path: $(npm_config_cache)
    displayName: Cache NPM
  - template: steps/node_script.yml@templates
    parameters:
      condition: or(eq(variables.runManageChecks, 'true'), eq(variables.runPortalChecks, 'true'), eq(variables.runCrossServiceChecks, 'true'))
      nodeVersion: 24
      script: npm ci
      environmentVariables:
        npm_config_cache: $(npm_config_cache)
  - template: steps/node_script.yml@templates
    parameters:
      condition: or(eq(variables.runManageChecks, 'true'), eq(variables.runPortalChecks, 'true'), eq(variables.runCrossServiceChecks, 'true'))
      nodeVersion: 24
      script: npm run db-generate
  - template: steps/node_script.yml@templates
    parameters:
      condition: or(eq(variables.runManageChecks, 'true'), eq(variables.runCrossServiceChecks, 'true'))
      nodeVersion: 24
      workingDirectory: $(Build.Repository.LocalPath)/apps/manage
      script: npm run build
  - template: steps/node_script.yml@templates
    parameters:
      condition: or(eq(variables.runPortalChecks, 'true'), eq(variables.runCrossServiceChecks, 'true'))
      nodeVersion: 24
      workingDirectory: $(Build.Repository.LocalPath)/apps/portal
      script: npm run build
  - bash: |
      set -euo pipefail

      if docker compose version > /dev/null 2>&1; then
        echo "##vso[task.setvariable variable=ComposeCommand]docker compose"
      elif command -v docker-compose > /dev/null 2>&1; then
        echo "##vso[task.setvariable variable=ComposeCommand]docker-compose"
      else
        echo "Docker Compose is not available on this agent."
        exit 1
      fi
    condition: and(succeeded(), or(eq(variables.runManageChecks, 'true'), eq(variables.runPortalChecks, 'true'), eq(variables.runCrossServiceChecks, 'true')))
    displayName: Detect Docker Compose command
  - bash: |
      set -euo pipefail

      if [ -z "${MSSQL_DATA_VOLUME:-}" ]; then
        rm -rf tmp/mssql-data
      fi

      $(ComposeCommand) down -v
      $(ComposeCommand) up -d mssql

      for attempt in {1..30}; do
        if npm run db-migrate-prod; then
          exit 0
        fi

        echo "SQL Server is not ready yet. Retrying migration in 5 seconds..."
        sleep 5
      done

      echo "SQL Server did not become ready in time."
      $(ComposeCommand) logs mssql
      exit 1
    condition: and(succeeded(), or(eq(variables.runManageChecks, 'true'), eq(variables.runPortalChecks, 'true'), eq(variables.runCrossServiceChecks, 'true')))
    displayName: Start local database and apply migrations
    env:
      MSSQL_DATA_MOUNT: mssql-data
      MSSQL_DATA_VOLUME: local-plans-${{ parameters.target }}-mssql-data-${{ parameters.shardIndex }}
      SQL_CONNECTION_STRING: $(localSqlConnectionString)
      SQL_CONNECTION_STRING_ADMIN: $(localSqlConnectionString)
  - bash: |
      npx azurite --silent --skipApiVersionCheck &
      echo "##vso[task.setvariable variable=AzuritePid]$!"
    condition: and(succeeded(), or(eq(variables.runPortalChecks, 'true'), eq(variables.runCrossServiceChecks, 'true')))
    displayName: Start Azurite

  - bash: |
      set -euo pipefail

      target="${{ parameters.target }}"
      shard_index="${{ parameters.shardIndex }}"
      shard_count="${{ parameters.shardCount }}"
      pids=""

      cleanup() {
        for pid in $pids; do
          pkill -P "$pid" 2>/dev/null || true
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
        done
        pids=""
      }
      trap cleanup EXIT

      wait_for_health() {
        local name="$1"
        local url="$2"

        echo "Waiting for $name health at $url"
        for attempt in {1..60}; do
          if curl --fail --silent "$url" > /dev/null; then
            return 0
          fi

          sleep 2
        done

        echo "$name did not become healthy in time."
        return 1
      }

      start_manage() {
        PORT='8090' npm run start --workspace=local-plans-manage &
        pids="$pids $!"
        wait_for_health "Manage" "$MANAGE_BASE_URL/health"
      }

      start_portal() {
        PORT='8080' npm run start --workspace=local-plans-portal &
        pids="$pids $!"
        wait_for_health "Portal" "$PORTAL_BASE_URL/health"
      }

      run_specs() {
        local test_target="$1"
        local spec_dir="cypress/e2e/$test_target"
        local spec_list

        spec_list="$(
          find "$spec_dir" -type f -name '*.cy.ts' ! -path '*/accessibility/*' | sort | awk \
            -v shard_index="$shard_index" \
            -v shard_count="$shard_count" \
            '((NR - 1) % shard_count) == (shard_index - 1) { print }' | paste -sd, -
        )"

        if [ -z "$spec_list" ]; then
          echo "No $test_target specs were assigned to shard $shard_index of $shard_count"
          return 0
        fi

        npm run db-clear

        case "$test_target" in
          manage)
            start_manage
            ;;
          portal)
            start_portal
            ;;
          cross-service)
            start_manage
            start_portal
            ;;
          *)
            echo "Unknown E2E target: $test_target"
            exit 1
            ;;
        esac

        echo "Running $test_target E2E shard $shard_index of $shard_count"
        echo "$spec_list" | tr ',' '\n'
        npm run "cy:$test_target:all" -- --spec "$spec_list"

        if [ "$shard_index" = "1" ]; then
          case "$test_target" in
            manage|portal)
              echo "##[section]Running $test_target accessibility checks"
              npm run "cy:$test_target:accessibility"
              ;;
          esac
        fi

        cleanup
      }

      case "$target" in
        manage)
          [ "$RUN_MANAGE_CHECKS" = "true" ] && run_specs manage
          ;;
        portal)
          [ "$RUN_PORTAL_CHECKS" = "true" ] && run_specs portal
          ;;
        manage-portal)
          [ "$RUN_MANAGE_CHECKS" = "true" ] && run_specs manage
          [ "$RUN_PORTAL_CHECKS" = "true" ] && run_specs portal
          ;;
        cross-service)
          [ "$RUN_CROSS_SERVICE_CHECKS" = "true" ] && run_specs cross-service
          ;;
        *)
          echo "Unknown E2E target: $target"
          exit 1
          ;;
      esac
    condition: and(succeeded(), or(eq(variables.runManageChecks, 'true'), eq(variables.runPortalChecks, 'true'), eq(variables.runCrossServiceChecks, 'true')))
    displayName: Run ${{ parameters.target }} E2E tests against local app
    env:
      AUTH_DISABLED: 'true'
      GOV_NOTIFY_DISABLED: 'true'
      MANAGE_BASE_URL: $(manageLocalBaseUrl)
      PORTAL_BASE_URL: $(portalLocalBaseUrl)
      PORTAL_URL: $(portalLocalBaseUrl)
      RUN_CROSS_SERVICE_CHECKS: $(runCrossServiceChecks)
      RUN_MANAGE_CHECKS: $(runManageChecks)
      RUN_PORTAL_CHECKS: $(runPortalChecks)
      SESSION_SECRET: $(localSessionSecret)
      SQL_CONNECTION_STRING: $(localSqlConnectionString)
  - bash: mkdir -p cypress/reports
    condition: failed()
    displayName: Prepare Cypress artifacts
  - task: PublishPipelineArtifact@1
    condition: failed()
    displayName: Publish Cypress artifacts
    inputs:
      targetPath: $(Build.Repository.LocalPath)/cypress/reports
      artifact: cypress-${{ parameters.target }}-reports-shard-${{ parameters.shardIndex }}
  - bash: kill $(AzuritePid) 2>/dev/null || true
    condition: always()
    displayName: Stop Azurite

  - bash: |
      if docker compose version > /dev/null 2>&1; then
        docker compose down -v
      elif command -v docker-compose > /dev/null 2>&1; then
        docker-compose down -v
      fi

      if [ -z "${MSSQL_DATA_VOLUME:-}" ]; then
        rm -rf tmp/mssql-data
      fi
    condition: and(always(), or(eq(variables.runManageChecks, 'true'), eq(variables.runPortalChecks, 'true'), eq(variables.runCrossServiceChecks, 'true')))
    displayName: Stop local database
    env:
      MSSQL_DATA_MOUNT: mssql-data
      MSSQL_DATA_VOLUME: local-plans-${{ parameters.target }}-mssql-data-${{ parameters.shardIndex }}
