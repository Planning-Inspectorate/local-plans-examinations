parameters:
  - name: environment
    displayName: Environment
    type: string
    default: Dev
    values:
      - Dev
      - Test
      - Training
      - Prod

pool: pins-odt-agent-pool

pr: none
trigger: none

resources:
  repositories:
    - repository: templates
      type: github
      endpoint: Planning-Inspectorate
      name: Planning-Inspectorate/common-pipeline-templates
      ref: refs/tags/release/3.24.2

variables:
  - template: variables/environments/${{ lower(parameters.environment )}}.yml@templates
  - group: pipeline_secrets

jobs:
  - deployment: Seed_DB
    displayName: Seed ${{ parameters.environment }} SQL Database
    environment: ${{ parameters.environment }}
    strategy:
      runOnce:
        deploy:
          steps:
            - download: none
            - checkout: self
            - template: steps/node_script.yml@templates
              parameters:
                nodeVersion: 24
                script: npm ci --workspace=@pins/local-plans-database
            - template: steps/azure_auth.yml@templates
            - bash: |
                if [[ $ENVIRONMENT == "training" ]]; then
                  echo "Name: pins-kv-local-plan-train (env: $ENVIRONMENT)"
                  echo "##vso[task.setvariable variable=kvName;]pins-kv-local-plan-train"
                else
                  echo "Name: pins-kv-local-plans-$ENVIRONMENT (env: $ENVIRONMENT)"
                  echo "##vso[task.setvariable variable=kvName;]pins-kv-local-plans-$ENVIRONMENT"
                fi
              displayName: Set KV name
              env:
                ENVIRONMENT: $(ENVIRONMENT)
            - template: steps/azure_get_secrets.yml@templates
              parameters:
                keyVaultName: $(kvName)
                secrets:
                  - name: local-plans-sql-app-connection-string
                    variable: SQL_CONNECTION_STRING
            - template: steps/node_script.yml@templates
              parameters:
                nodeVersion: 24
                condition: in('${{ parameters.environment }}', 'Dev', 'Test', 'Training')
                environmentVariables:
                  SQL_CONNECTION_STRING: $(SQL_CONNECTION_STRING)
                script: npm run generate && npm run seed
                workingDirectory: $(Build.Repository.LocalPath)/packages/database
            - task: DownloadSecureFile@1
              condition: in('${{ parameters.environment }}', 'Dev', 'Training', 'Prod')
              name: productionLpaList
              displayName: 'Download Production LPA List'
              inputs:
                secureFile: 'production_lpa_list.csv'
            - template: steps/node_script.yml@templates
              parameters:
                condition: in('${{ parameters.environment }}', 'Dev', 'Training', 'Prod')
                nodeVersion: 24
                script: npm run read-lpa-data
                workingDirectory: $(Build.Repository.LocalPath)/packages/database
                environmentVariables:
                  LPA_DATA_FILE_PATH: $(productionLpaList.secureFilePath)
            - template: steps/node_script.yml@templates
              parameters:
                condition: in('${{ parameters.environment }}', 'Dev', 'Training', 'Prod')
                nodeVersion: 24
                environmentVariables:
                  SQL_CONNECTION_STRING: $(SQL_CONNECTION_STRING)
                script: npm run seed-prod
                workingDirectory: $(Build.Repository.LocalPath)/packages/database
    workspace:
      clean: all
