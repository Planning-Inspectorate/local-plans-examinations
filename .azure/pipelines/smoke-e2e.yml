trigger: none
pr: none

schedules:
  - cron: '0 6 * * 1-5'
    displayName: Weekday Test smoke
    branches:
      include:
        - main
    always: true

resources:
  repositories:
    - repository: templates
      type: github
      endpoint: Planning-Inspectorate
      name: Planning-Inspectorate/common-pipeline-templates
      ref: refs/tags/release/3.30.0

pool: pins-odt-agent-pool

extends:
  template: stages/wrapper_ci.yml@templates
  parameters:
    gitFetchDepth: 1
    skipAzureAuth: true
    globalVariables:
      - template: .azure/pipelines/variables.yml@self
      - template: /variables/environments/test.yml@templates
      - group: pipeline_secrets
      - name: e2eAuthUsername
        value: svc-localplansuser@planninginspectorate.gov.uk
      - name: e2eAuthUserId
        value: 7a502c20-3aad-41bf-9eac-3f602d7373ed
      - name: e2eNotifyEmail
        value: svc-localplansuser@planninginspectorate.gov.uk
      - name: manageSmokeBaseUrl
        value: https://local-plans-manage-test.planninginspectorate.gov.uk
      - name: portalSmokeBaseUrl
        value: https://local-plans-portal-test.planninginspectorate.gov.uk
    validationJobs:
      - name: Run Test smoke E2E
        steps:
          - task: Cache@2
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)" | package-lock.json
              path: $(npm_config_cache)
            displayName: Cache NPM

          - template: /steps/node_script.yml@templates
            parameters:
              displayName: 'npm ci'
              nodeVersion: 24
              script: npm ci
              environmentVariables:
                npm_config_cache: $(npm_config_cache)

          - template: /steps/azure_auth.yml@templates

          - template: /steps/azure_get_secrets.yml@templates
            parameters:
              keyVaultName: pins-kv-local-plans-test
              secrets:
                - name: local-plans-sql-app-connection-string
                  variable: SQL_CONNECTION_STRING
                - name: localplans-gov-notify-api-key
                  variable: GOV_NOTIFY_API_KEY

          - bash: npm run cy:manage:test-smoke
            displayName: Run Manage smoke against Test
            env:
              CYPRESS_AUTH_PASSWORD: $(E2E_AUTH_PASSWORD)
              CYPRESS_AUTH_USER_ID: $(e2eAuthUserId)
              CYPRESS_AUTH_USERNAME: $(e2eAuthUsername)
              CYPRESS_NOTIFY_SMOKE_EMAIL: $(e2eNotifyEmail)
              CYPRESS_NOTIFY_SMOKE_ENABLED: 'true'
              CYPRESS_USE_REAL_AUTH: 'true'
              GOV_NOTIFY_API_KEY: $(GOV_NOTIFY_API_KEY)
              MANAGE_BASE_URL: $(manageSmokeBaseUrl)
              SQL_CONNECTION_STRING: $(SQL_CONNECTION_STRING)

          - bash: npm run cy:portal:test-smoke
            condition: succeededOrFailed()
            displayName: Run Portal smoke against Test
            env:
              CYPRESS_AUTH_PASSWORD: $(E2E_AUTH_PASSWORD)
              CYPRESS_AUTH_USERNAME: $(e2eAuthUsername)
              CYPRESS_USE_REAL_AUTH: 'true'
              PORTAL_BASE_URL: $(portalSmokeBaseUrl)

          - bash: mkdir -p cypress/reports
            condition: failed()
            displayName: Prepare Cypress artifacts

          - task: PublishPipelineArtifact@1
            condition: failed()
            displayName: Publish Cypress artifacts
            inputs:
              targetPath: $(Build.Repository.LocalPath)/cypress/reports
              artifact: cypress-test-smoke-reports
