parameters:
  - name: manageUsers
    displayName: Manage sessions
    type: number
    default: 5
  - name: rampSeconds
    displayName: Ramp-up seconds
    type: number
    default: 120
  - name: durationSeconds
    displayName: Hold duration in seconds after ramp-up
    type: number
    default: 600
  - name: requestPauseMs
    displayName: Pause between user actions in ms
    type: number
    default: 10000
  - name: readMs
    displayName: Page read p95 limit in ms
    type: number
    default: 2000
  - name: saveMs
    displayName: Save p95 limit in ms
    type: number
    default: 3000

trigger: none
pr: none

schedules:
  - cron: '0 7,19 * * *'
    displayName: Daily Test performance
    branches:
      include:
        - main
    always: true

resources:
  repositories:
    - repository: templates
      type: github
      endpoint: Planning-Inspectorate
      name: Planning-Inspectorate/common-pipeline-templates
      ref: refs/tags/release/3.25.2

extends:
  template: stages/wrapper_ci.yml@templates
  parameters:
    environment: test
    gitFetchDepth: 0
    skipAzureAuth: true
    globalVariables:
      - template: .azure/pipelines/variables.yml@self
      - template: /variables/environments/test.yml@templates
      - template: .azure/pipelines/variables/test-smoke.yml@self
      - group: pipeline_secrets
    validationJobs:
      - name: Run Manage performance against Test
        steps:
          - bash: |
              set -euo pipefail

              java_home="$(Pipeline.Workspace)/java"
              archive="$(Pipeline.Workspace)/java.tgz"

              if [ ! -x "$java_home/bin/java" ]; then
                mkdir -p "$java_home"
                curl --fail --location --output "$archive" "https://api.adoptium.net/v3/binary/latest/17/ga/linux/x64/jre/hotspot/normal/eclipse"
                tar -xzf "$archive" -C "$java_home" --strip-components=1
              fi

              echo "##vso[task.setvariable variable=JAVA_HOME]$java_home"
              echo "##vso[task.prependpath]$java_home/bin"
              "$java_home/bin/java" -version
            displayName: Install Java runtime

          - bash: |
              set -euo pipefail

              jmeter_version='5.6.3'
              jmeter_home="$(Pipeline.Workspace)/apache-jmeter-${jmeter_version}"
              archive="$(Pipeline.Workspace)/apache-jmeter-${jmeter_version}.tgz"

              if [ ! -x "$jmeter_home/bin/jmeter" ]; then
                curl --fail --location --output "$archive" "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${jmeter_version}.tgz"
                tar -xzf "$archive" -C "$(Pipeline.Workspace)"
              fi

              echo "##vso[task.setvariable variable=JMETER_BIN]$jmeter_home/bin/jmeter"
            displayName: Download Apache JMeter

          - task: Cache@2
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              path: $(npm_config_cache)
            displayName: Cache NPM

          - template: /steps/node_script.yml@templates
            parameters:
              nodeVersion: 24
              script: npm ci
              environmentVariables:
                npm_config_cache: $(npm_config_cache)

          - template: /steps/node_script.yml@templates
            parameters:
              nodeVersion: 24
              script: npm run db-generate

          - template: /steps/azure_auth.yml@templates

          - template: /steps/azure_get_secrets.yml@templates
            parameters:
              keyVaultName: pins-kv-local-plans-test
              secrets:
                - name: local-plans-sql-app-connection-string
                  variable: SQL_CONNECTION_STRING

          - template: /steps/node_script.yml@templates
            parameters:
              nodeVersion: 24
              script: npm run perf:test
              environmentVariables:
                JMETER_BIN: $(JMETER_BIN)
                SQL_CONNECTION_STRING: $(SQL_CONNECTION_STRING)
                CYPRESS_AUTH_PASSWORD: $(E2E_AUTH_PASSWORD)
                CYPRESS_AUTH_USERNAME: $(e2eAuthUsername)
                CYPRESS_AUTH_USER_ID: $(e2eAuthUserId)
                MANAGE_BASE_URL: $(manageSmokeBaseUrl)
                PERFORMANCE_LOCAL: 'false'
                PERFORMANCE_PRIVATE_DIR: $(Agent.TempDirectory)/local-plans-performance-$(Build.BuildId)
                PERFORMANCE_MANAGE_USERS: ${{ parameters.manageUsers }}
                PERFORMANCE_RAMP_SECONDS: ${{ parameters.rampSeconds }}
                PERFORMANCE_DURATION_SECONDS: ${{ parameters.durationSeconds }}
                PERFORMANCE_REQUEST_PAUSE_MS: ${{ parameters.requestPauseMs }}
                PERFORMANCE_READ_MS: ${{ parameters.readMs }}
                PERFORMANCE_SAVE_MS: ${{ parameters.saveMs }}

          - bash: mkdir -p performance/results
            condition: always()
            displayName: Prepare performance artifacts

          - task: PublishPipelineArtifact@1
            condition: always()
            displayName: Publish performance artifacts
            inputs:
              targetPath: $(Build.Repository.LocalPath)/performance/results
              artifact: performance-results
