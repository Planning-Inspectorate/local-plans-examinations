parameters:
  - name: threads
    displayName: Threads
    type: number
    default: 5
  - name: rampSeconds
    displayName: Ramp-up seconds
    type: number
    default: 30
  - name: durationSeconds
    displayName: Duration seconds
    type: number
    default: 300
  - name: requestPauseMs
    displayName: Pause between requests in ms
    type: number
    default: 1000

trigger: none
pr: none

resources:
  repositories:
    - repository: templates
      type: github
      endpoint: Planning-Inspectorate
      name: Planning-Inspectorate/common-pipeline-templates
      ref: refs/tags/release/3.25.2

extends:
  template: stages/wrapper_ci.yml@templates
  parameters:
    gitFetchDepth: 0
    skipAzureAuth: true
    globalVariables:
      - template: .azure/pipelines/variables.yml@self
      - template: /variables/environments/test.yml@templates
      - group: pipeline_secrets
      - name: ManagePerformanceHost
        value: local-plans-manage-test.planninginspectorate.gov.uk
      - name: PortalPerformanceHost
        value: local-plans-portal-test.planninginspectorate.gov.uk
    validationJobs:
      - name: Run performance baseline against Test
        steps:
          - bash: |
              set -euo pipefail

              java_home="$(Pipeline.Workspace)/java"
              archive="$(Pipeline.Workspace)/java.tgz"

              if [ ! -x "$java_home/bin/java" ]; then
                mkdir -p "$java_home"
                curl --fail --location --output "$archive" "https://api.adoptium.net/v3/binary/latest/17/ga/linux/x64/jre/hotspot/normal/eclipse"
                tar -xzf "$archive" -C "$java_home" --strip-components=1
              fi

              echo "##vso[task.setvariable variable=JAVA_HOME]$java_home"
              echo "##vso[task.prependpath]$java_home/bin"
              "$java_home/bin/java" -version
            displayName: Install Java runtime

          - bash: |
              set -euo pipefail

              jmeter_version='5.6.3'
              jmeter_home="$(Pipeline.Workspace)/apache-jmeter-${jmeter_version}"
              archive="$(Pipeline.Workspace)/apache-jmeter-${jmeter_version}.tgz"

              if [ ! -x "$jmeter_home/bin/jmeter" ]; then
                curl --fail --location --output "$archive" "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${jmeter_version}.tgz"
                tar -xzf "$archive" -C "$(Pipeline.Workspace)"
              fi

              echo "##vso[task.setvariable variable=JMETER_BIN]$jmeter_home/bin/jmeter"
            displayName: Download Apache JMeter

          - bash: |
              set -euo pipefail

              check_url() {
                local name="$1"
                local url="$2"

                echo "Checking $name: $url"
                curl --fail --silent --show-error "$url" > /dev/null
              }

              check_health() {
                local name="$1"
                local url="$2"

                echo "Checking $name: $url"
                response="$(curl --fail --silent --show-error "$url")"
                echo "$response" | grep '"status":"OK"' > /dev/null
                echo "$response" | grep '"database":"OK"' > /dev/null
              }

              check_health "Manage health" "https://$(ManagePerformanceHost)/health"
              check_url "Portal home" "https://$(PortalPerformanceHost)/"
            displayName: Check target availability

          - bash: |
              set -euo pipefail

              mkdir -p performance/results
              rm -rf performance/results/*

              if [ -z "${PERFORMANCE_TEST_AUTH_TOKEN:-}" ]; then
                echo "Performance test auth token is required."
                exit 1
              fi

              "$(JMETER_BIN)" -n \
                -t performance/local-plans.jmx \
                -l performance/results/local-plans-baseline.jtl \
                -e \
                -o performance/results/html \
                -Jjmeter.save.saveservice.output_format=csv \
                -Jjmeter.save.saveservice.print_field_names=true \
                -JmanageProtocol=https \
                -JmanageHost="$(ManagePerformanceHost)" \
                -JportalProtocol=https \
                -JportalHost="$(PortalPerformanceHost)" \
                -Jthreads="${{ parameters.threads }}" \
                -JrampSeconds="${{ parameters.rampSeconds }}" \
                -JdurationSeconds="${{ parameters.durationSeconds }}" \
                -JrequestPauseMs="${{ parameters.requestPauseMs }}" \
                -JperformanceAuthToken="$PERFORMANCE_TEST_AUTH_TOKEN"
            displayName: Run JMeter baseline
            env:
              PERFORMANCE_TEST_AUTH_TOKEN: $(PERFORMANCE_TEST_AUTH_TOKEN)

          - bash: |
              set -euo pipefail

              if grep -q ',false,' performance/results/local-plans-baseline.jtl; then
                awk -F, '
                  NR == 1 {
                    for (i = 1; i <= NF; i++) {
                      columns[$i] = i
                    }
                    next
                  }
                  $columns["success"] == "false" {
                    print "Failed sample: " $columns["label"] " (" $columns["responseCode"] " " $columns["responseMessage"] ")"
                    if ($columns["failureMessage"]) {
                      print "Failure message: " $columns["failureMessage"]
                    }
                  }
                ' performance/results/local-plans-baseline.jtl
                echo "One or more JMeter samples failed. See the JTL and HTML report artifacts."
                exit 1
              fi
            displayName: Check JMeter sample failures

          - bash: mkdir -p performance/results
            condition: always()
            displayName: Prepare performance artifacts

          - task: PublishPipelineArtifact@1
            condition: always()
            displayName: Publish performance artifacts
            inputs:
              targetPath: $(Build.Repository.LocalPath)/performance/results
              artifact: performance-results
